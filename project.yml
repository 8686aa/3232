# XcodeGen 描述文件：CI 靠它生成 GORaDar.xcodeproj（本机是 Windows，没有 Xcode，
# 所以工程文件不入库，一律现场生成，避免 pbxproj 手改不同步）。
# 本地 macOS 上等价于：brew install xcodegen && xcodegen generate
name: GORaDar

options:
  bundleIdPrefix: com.goradar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # XcodeGen 默认 projectFormat 是 xcode16_0（objectVersion 77），runner 上的
  # Xcode 15.4 打不开，会报 "future Xcode project file format (77)"。
  # 降到 xcode15_3，新旧 Xcode 都能读。
  projectFormat: xcode15_3

packages:
  StarRadarCore:
    path: Core

targets:
  GORaDar:
    type: application
    platform: iOS
    sources:
      - path: App
        # Info.plist 走 INFOPLIST_FILE 进包，不能再进 Copy Resources，
        # 否则 Xcode 报 "Multiple commands produce Info.plist"
        excludes:
          - Info.plist
    dependencies:
      - package: StarRadarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goradar.middleman
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        # 1 = iPhone，2 = iPad。两个都要：否则在 iPad 上只能跑 iPhone 兼容模式（放大裁切），
        # 宽高都由系统按 iPhone 逻辑尺寸缩放，根本谈不上适配。
        TARGETED_DEVICE_FAMILY: "1,2"
        # 未签名打包：CI 上没有证书，签名相关的全部关掉，
        # 产出的 .app 交给重签工具（AltStore / Sideloadly / 爱思）处理
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  GORaDar:
    build:
      targets:
        GORaDar: all
    run:
      config: Debug
    archive:
      config: Release
